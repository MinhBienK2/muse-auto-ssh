# Contract lint cua repo - dung chung cho may dev va CI.
#
# Ruff >= 0.17 bat len bo rule MAC DINH moi (UP/PLW/RUF/FURB/ASYNC...) -> 100
# loi "nguyen hinh" tren code hien tai, trong khi ruff cu (0.6, bo rule mac
# dinh E4/E7/E9/F) bao sach. Pin lai bo rule de moi phien ruff cho CUNG ket
# qua: CI xanh khong con phu thuoc version, may dev cung khong con "fail vi
# tool moi".
#
# Loi that su (E9, F) van bi bat - ruff tom tat cac loi Python sai.
[lint]
select = ["E4", "E7", "E9", "F"]
